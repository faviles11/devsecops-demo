# ─────────────────────────────────────────────────────────────
# SonarCloud project identification
# Replace both values after creating the project on sonarcloud.io
# Project URL format: sonarcloud.io/project/overview?id=<projectKey>
# ─────────────────────────────────────────────────────────────
sonar.organization=YOUR_SONARCLOUD_ORG_KEY
sonar.projectKey=YOUR_SONARCLOUD_PROJECT_KEY
sonar.projectName=devsecops-demo

# Source and test paths
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage — Jest writes lcov output here when run with --coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**
